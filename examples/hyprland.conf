# Float and center the nvim-keys window (Hyprland 0.45+ rule syntax).
# Append to ~/.config/hypr/hyprland.conf.

windowrule {
    name = nvim-keys-float

    match:class = ^(dev\.local\.nvim-keys)$

    float = yes
    size = 1080 720
    center = yes
}

# Older single-line syntax, if your Hyprland still uses windowrulev2:
# windowrulev2 = float,class:^(dev\.local\.nvim-keys)$
# windowrulev2 = size 1080 720,class:^(dev\.local\.nvim-keys)$
# windowrulev2 = center,class:^(dev\.local\.nvim-keys)$

# Optional keybinding instead of clicking the bar:
# bind = SUPER, F1, exec, ~/.local/bin/nvim-keys gui
